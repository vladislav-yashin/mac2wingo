name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: build universal DMG
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MAC2WINGO_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Both vendor/tools and its .tools-build working tree are cached: the
      # source trees there are needed to bundle the helper license texts.
      - name: Cache helper tools
        uses: actions/cache@v4
        with:
          path: |
            vendor/tools
            .tools-build
          key: helper-tools-${{ runner.os }}-${{ hashFiles('scripts/fetch-tools.sh') }}

      # GitHub's macOS runners ship no GNU autotools, which ntfs-3g needs
      # (its source archive has no pre-generated configure).
      - name: Install build dependencies
        run: brew install autoconf automake libtool gettext pkgconf

      - name: Build helper tools
        run: ./scripts/fetch-tools.sh

      # Import the Developer ID certificate into a throwaway keychain. Skipped
      # when the secret is absent (e.g. a fork); the build then falls back to
      # ad-hoc signing and the notarization check below fails for tagged builds.
      - name: Import code signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 -D -o "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k actions "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build universal app
        run: ./scripts/build-universal.sh

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Verify signature and notarization
        if: startsWith(github.ref, 'refs/tags/') && env.MAC2WINGO_SIGN_IDENTITY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Mac2Win Go.app"
          spctl -a -vvv --type execute "dist/Mac2Win Go.app"
          xcrun stapler validate "dist/Mac2Win Go.app"
          spctl -a -vvv --type open --context context:primary-signature -v dist/*.dmg
          xcrun stapler validate dist/*.dmg

      - name: Warn about the unsigned build
        if: startsWith(github.ref, 'refs/tags/') && env.MAC2WINGO_SIGN_IDENTITY == ''
        run: |
          echo "::warning title=Unsigned release::No Developer ID signing identity is configured. The DMG is ad-hoc signed and not notarized, so Gatekeeper blocks it once downloaded; tell users to follow the \"How to open.txt\" note inside the DMG (or clear com.apple.quarantine)."

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac2WinGo-dmg-${{ github.ref_name }}
          path: dist/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.dmg --generate-notes

      - name: Remove signing certificate
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
