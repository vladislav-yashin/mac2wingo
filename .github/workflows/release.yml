name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: build universal DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Both vendor/tools and its .tools-build working tree are cached: the
      # source trees there are needed to bundle the helper license texts.
      - name: Cache helper tools
        uses: actions/cache@v4
        with:
          path: |
            vendor/tools
            .tools-build
          key: helper-tools-${{ runner.os }}-${{ hashFiles('scripts/fetch-tools.sh') }}

      - name: Build helper tools
        run: ./scripts/fetch-tools.sh

      - name: Build universal app
        run: ./scripts/build-universal.sh

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac2WinGo-dmg-${{ github.ref_name }}
          path: dist/*.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.dmg --generate-notes
